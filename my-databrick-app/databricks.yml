bundle:
  name: my-databrick-app

variables:
  postgres_branch:
    description: Full Lakebase Postgres branch resource name. Obtain by running `databricks postgres list-branches {project-name}`, select the desired item from the output array and use its .name value. Requires the project resource name.
  postgres_database:
    description: Full Lakebase Postgres database resource name. Obtain by running `databricks postgres list-databases {branch-name}`, select the desired item from the output array and use its .name value. Requires the branch resource name.
  postgres_project:
    description: Full Lakebase Postgres project resource name. Obtain by running `databricks postgres list-projects`, select the desired item from the output array and use its .name value.
  vector_search_index:
    description: Three-level Unity Catalog name of the private-notes Delta Sync Vector Search index.
  serving_endpoint_name:
    description: Name of a streaming-compatible Databricks Model Serving endpoint for the notes assistant.

resources:
  apps:
    app:
      name: "my-databrick-app"
      description: "A Databricks App powered by AppKit"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      # Uncomment to enable on behalf of user API scopes. Available scopes: sql, dashboards.genie, files.files, serving.serving-endpoints
      user_api_scopes:
        - postgres
        - serving.serving-endpoints

      # The resources which this app has access to.
      resources:
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE
        - name: notes-assistant
          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_QUERY

targets:
  default:
    default: true
    workspace:
      host: https://dbc-9fbaad2a-655d.cloud.databricks.com

    variables:
      postgres_project: projects/myfirstdatabricksapp
      postgres_branch: projects/myfirstdatabricksapp/branches/production
      postgres_database: projects/myfirstdatabricksapp/branches/production/databases/databricks-postgres
      vector_search_index: main.default.private_notes_index
      serving_endpoint_name: databricks-claude-sonnet-4-5
